name: Outset
description: >-
  Outset is an AI-powered qualitative research platform, operated by Parnassus
  Labs, Inc., that lets enterprise research and product teams run large-scale
  AI-moderated interviews across video, voice, and text in 85+ countries and
  many languages. Its AI moderators conduct conversational interviews, an
  AI-driven synthesis layer produces summaries, themes, quotes, and highlight
  reels, and a Visual Intelligence suite analyzes visual cues during sessions.
  The platform includes participant recruitment against a large panel plus an
  AI fraud-detection agent. Customers include Microsoft, HubSpot, Nestle,
  Glassdoor, Coinbase, and Indeed. Outset publishes SOC 2 Type II, ISO 42001,
  HIPAA, and GDPR compliance posture but exposes no public developer API,
  documentation, or developer portal at this time.
